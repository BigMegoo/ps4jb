<!DOCTYPE html>
<html manifest="slopkit.manifest">
<head>
    <title>Big Megoo Gamer Zone 01003810764 - Cache 11.50-13.00</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* تثبيت اسم Big Megoo Gamer Zone باللون الذهبي الثابت */
        .name-Big Megoo Gamer Zone {
            color: #ffd700 !important;
            font-weight: 900 !important;
            font-size: 3rem !important;
            letter-spacing: 5px !important;
            font-family: 'Orbitron', sans-serif !important;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4) !important;
            display: block !important;
            background: none !important;
            -webkit-background-clip: unset !important;
            -webkit-text-fill-color: #ffd700 !important;
            animation: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="main-title">
                <span class="name-Big Megoo">Big Megoo</span>
                <span class="Gamer-title">Gamer</span>
                <span class="Zone-title">Zone</span>
            </h1>
            <div class="subtitle">Ps4 تعديل</div>
            <div class="version-badge">FW 11.50 - 13.00</div>
        </header>
        
        <hr class="separator">
        
        <div class="status-bar">
            <span id="msgs" class="status-text loading">Starting Cache Installation...</span>
           </div>
        
        <footer>
            <p class="credit">Designed by <a href="#" class="credit-link">Big Megoo Gamer Zone 01003810764</a></p>
            <span style="color: ##FFFFFF; font-size: 20px;">العنوان/محافظة الشرقية/مركز الحسنية شارع المركز مول صن سكوير </span>
        </footer>
    </div>

    <script>
        history.replaceState(null, null, 'index.html');
        var histlength = history.length;
        history.go(-histlength);
        
        var msgs = document.getElementById('msgs');
        
        function DLProgress(e) {
            var Percent = Math.round(e.loaded / e.total * 100);
            msgs.innerHTML = "Installing Offline Cache: " + Percent + "%";
        }
        
        function DisplayCacheProgress() {
            msgs.innerHTML = "Cache Installed Successfully";
            msgs.className = "status-text success";
            setTimeout(function() {
                msgs.innerHTML = "Now Close And Re-Open Your Browser ...";
            }, 1500);
        }
        
        window.applicationCache.addEventListener("progress", DLProgress, false);
        window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
        window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
        window.applicationCache.onerror = function(e) {
            msgs.innerHTML = "Error Installing Cache! - Clear and Re-Open Your Browser ...";
            msgs.className = "status-text error";
        };
    </script>
</body>
</html>
